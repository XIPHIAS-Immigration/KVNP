<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join your team | PassportLens</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/theme.css?v=pl-4" />
  <link rel="stylesheet" href="/src/portal.css?v=pl-4" />
  <style>
    .invite{max-width:520px; margin:40px auto; padding:0 20px;}
    .invite .card{padding:30px; display:grid; gap:14px;}
    .invite h1{font-size:26px;}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/" aria-label="PassportLens home"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="#351C15"/><circle cx="24" cy="23" r="12.5" fill="none" stroke="#FFB500" stroke-width="3.5"/><circle cx="24" cy="23" r="5" fill="#FFB500"/><circle cx="29.5" cy="17.5" r="2" fill="#fff" opacity=".9"/><rect x="13" y="38" width="22" height="2.6" rx="1.3" fill="#FFB500" opacity=".85"/></svg><span class="brand-name">Passport<b>Lens</b></span></a>
  </div></header>
  <main class="invite">
    <h1 id="invite-title">Checking your invitation…</h1>
    <p class="muted" id="invite-copy"></p>
    <form class="card" id="invite-form" hidden novalidate>
      <p class="small muted" id="invite-email"></p>
      <label class="field" id="name-field"><span>Your name</span><input id="name" autocomplete="name" minlength="2" maxlength="120" /></label>
      <label class="field"><span id="password-label">Choose a password</span><input id="password" type="password" required minlength="8" maxlength="256" /></label>
      <p class="form-msg bad" id="invite-status" aria-live="polite"></p>
      <button class="btn block" type="submit" id="invite-button">Join and open the studio</button>
    </form>
    <div class="notice bad" id="invite-error" hidden><b>This invitation can't be used.</b><p id="invite-error-copy"></p><p>Ask the business owner to send a new one, or <a href="/#contact">contact us</a>.</p></div>
  </main>
  <script>
  (function () {
    var token = new URLSearchParams(location.search).get("token") || "";
    var form = document.getElementById("invite-form");
    var existing = false;
    function fail(message) {
      document.getElementById("invite-title").textContent = "Invitation problem";
      document.getElementById("invite-error").hidden = false;
      document.getElementById("invite-error-copy").textContent = message;
    }
    if (!token) { fail("The invitation link is incomplete."); return; }
    fetch("/api/invites/" + encodeURIComponent(token)).then(function (r) { return r.json().then(function (d) { return [r.ok, d]; }); }).then(function (res) {
      if (!res[0] || !res[1].ok) { fail(res[1].detail || res[1].error || "Invalid or expired invitation."); return; }
      var d = res[1];
      existing = d.existingAccount;
      document.getElementById("invite-title").textContent = "Join " + d.orgName + " on PassportLens";
      document.getElementById("invite-copy").textContent = existing ? "You already have a PassportLens account with this email. Enter its password to join the team." : "Set a password to create your login. Your email is the address the invitation was sent to.";
      document.getElementById("invite-email").textContent = "Email: " + d.email;
      document.getElementById("name-field").hidden = existing;
      document.getElementById("name").value = d.name || "";
      document.getElementById("password-label").textContent = existing ? "Your password" : "Choose a password (8+ characters)";
      document.getElementById("password").autocomplete = existing ? "current-password" : "new-password";
      form.hidden = false;
    }).catch(function () { fail("Could not check the invitation. Refresh to try again."); });
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var button = document.getElementById("invite-button");
      var status = document.getElementById("invite-status");
      button.disabled = true; status.textContent = "";
      fetch("/api/invites/" + encodeURIComponent(token) + "/accept", {
        method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: document.getElementById("name").value, password: document.getElementById("password").value }),
      }).then(function (r) { return r.json().then(function (d) { return [r.ok, d]; }); }).then(function (res) {
        if (!res[0] || !res[1].ok) { status.textContent = res[1].detail || res[1].error || "Could not join."; button.disabled = false; return; }
        location.replace("/app");
      }).catch(function () { status.textContent = "Network problem. Try again."; button.disabled = false; });
    });
  })();
  </script>
</body>
</html>
