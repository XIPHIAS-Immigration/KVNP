<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activate your account | PassportLens</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/theme.css?v=pl-4" />
  <link rel="stylesheet" href="/src/portal.css?v=pl-4" />
  <style>
    .activate{max-width:560px; margin:40px auto; padding:0 20px;}
    .activate .card{padding:30px; display:grid; gap:14px;}
    .activate h1{font-size:26px;}
    .activate .lead{color:var(--text-2);}
    .steps-mini{display:flex; gap:8px; font-size:12.5px; color:var(--mut); margin-bottom:18px; flex-wrap:wrap;}
    .steps-mini span{padding:4px 10px; border-radius:999px; background:var(--bg-3);} .steps-mini span.on{background:var(--gold); color:var(--navy); font-weight:700;}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/" aria-label="PassportLens home"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="#351C15"/><circle cx="24" cy="23" r="12.5" fill="none" stroke="#FFB500" stroke-width="3.5"/><circle cx="24" cy="23" r="5" fill="#FFB500"/><circle cx="29.5" cy="17.5" r="2" fill="#fff" opacity=".9"/><rect x="13" y="38" width="22" height="2.6" rx="1.3" fill="#FFB500" opacity=".85"/></svg><span class="brand-name">Passport<b>Lens</b></span></a>
  </div></header>
  <main class="activate">
    <div class="steps-mini"><span>1 Pay</span><span class="on">2 Create login</span><span>3 Make photos</span></div>
    <h1 id="payment-title">Checking your payment…</h1>
    <p class="lead" id="payment-copy">We verify the payment with Stripe before creating any account. Your card details never pass through PassportLens.</p>
    <form class="card" id="activation-form" hidden novalidate>
      <h2 id="form-title">Create your account</h2>
      <p class="small muted" id="account-email"></p>
      <label class="field" id="name-field"><span>Your name</span><input id="name" name="name" autocomplete="name" minlength="2" maxlength="120" /></label>
      <label class="field"><span>Password</span><input id="password" name="password" type="password" required minlength="8" maxlength="256" /></label>
      <label class="field" id="confirm-field"><span>Confirm password</span><input id="password-confirm" type="password" minlength="8" maxlength="256" /></label>
      <p class="small muted" id="password-note"></p>
      <p class="form-msg bad" id="activation-status" aria-live="polite"></p>
      <button class="btn block" type="submit" id="activate-button">Activate and enter the studio</button>
    </form>
    <div class="notice bad" id="activation-error" hidden>
      <b>We could not verify this payment.</b>
      <p id="activation-error-copy"></p>
      <p><a href="/pricing">Back to pricing</a> · <a href="/#contact">Contact support</a></p>
    </div>
  </main>
  <script type="module" src="/src/activate.js?v=pl-4"></script>
</body>
</html>
