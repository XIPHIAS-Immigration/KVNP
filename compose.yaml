services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      KVNP_DATA_DIR: /app/data
      KVNP_SESSION_SECRET: ${KVNP_SESSION_SECRET:?set KVNP_SESSION_SECRET in .env}
    volumes:
      - kvnp_data:/app/data
    expose:
      - "4173"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  kvnp_data:
  caddy_data:
  caddy_config:
