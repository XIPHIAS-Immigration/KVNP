services:
  model-init:
    image: python:3.11-slim
    restart: "no"
    working_dir: /work
    environment:
      KVNP_MODEL_DIR: /app/models
    command: ["python", "tools/download_models.py", "--model", "${KVNP_QUALITY_MODEL:-birefnet-portrait}"]
    volumes:
      - ./tools/download_models.py:/work/tools/download_models.py:ro
      - kvnp_models:/app/models

  app:
    build: .
    image: kvnp-app
    restart: unless-stopped
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      KVNP_DATA_DIR: /app/data
      KVNP_MODEL_DIR: /app/models
      KVNP_MATTING_ENGINE: ${KVNP_MATTING_ENGINE:-birefnet}
      KVNP_ONNX_PROVIDER: ${KVNP_ONNX_PROVIDER:-auto}
      KVNP_ONNX_THREADS: ${KVNP_ONNX_THREADS:-2}
      KVNP_SESSION_SECRET: ${KVNP_SESSION_SECRET:?set KVNP_SESSION_SECRET in .env}
      KVNP_COOKIE_SECURE: ${KVNP_COOKIE_SECURE:-false}
      KVNP_PAYMENT_MODE: ${KVNP_PAYMENT_MODE:-disabled}
      KVNP_ALLOW_MOCK_PAYMENTS: ${KVNP_ALLOW_MOCK_PAYMENTS:-false}
      KVNP_COMMERCE_ENFORCED: ${KVNP_COMMERCE_ENFORCED:-false}
      KVNP_APPLICATION_PRICE_MINOR: ${KVNP_APPLICATION_PRICE_MINOR:-19900}
      KVNP_APPLICATION_CURRENCY: ${KVNP_APPLICATION_CURRENCY:-INR}
      KVNP_PUBLIC_URL: ${KVNP_PUBLIC_URL:-https://${DOMAIN}}
      KVNP_SUBSCRIPTION_PRICE_LABEL: ${KVNP_SUBSCRIPTION_PRICE_LABEL:-Price shown at checkout}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_PRICE_SILVER_MONTHLY: ${STRIPE_PRICE_SILVER_MONTHLY:-}
      STRIPE_PRICE_SILVER_YEARLY: ${STRIPE_PRICE_SILVER_YEARLY:-}
      STRIPE_PRICE_SINGLE: ${STRIPE_PRICE_SINGLE:-}
      STRIPE_PRICE_SILVER_MONTHLY_USD: ${STRIPE_PRICE_SILVER_MONTHLY_USD:-}
      STRIPE_PRICE_SILVER_YEARLY_USD: ${STRIPE_PRICE_SILVER_YEARLY_USD:-}
      STRIPE_PRICE_SINGLE_USD: ${STRIPE_PRICE_SINGLE_USD:-}
      KVNP_PRICE_SINGLE_USD_MINOR: ${KVNP_PRICE_SINGLE_USD_MINOR:-799}
      KVNP_PRICE_SILVER_MONTHLY_USD_MINOR: ${KVNP_PRICE_SILVER_MONTHLY_USD_MINOR:-7500}
      KVNP_PRICE_SILVER_YEARLY_USD_MINOR: ${KVNP_PRICE_SILVER_YEARLY_USD_MINOR:-74900}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-CAD}
      STRIPE_INTEGRATION_IDENTIFIER: ${STRIPE_INTEGRATION_IDENTIFIER:-}
      KVNP_STRICT_POLICY: ${KVNP_STRICT_POLICY:-false}
      KVNP_MAX_CONCURRENT_JOBS: ${KVNP_MAX_CONCURRENT_JOBS:-2}
      KVNP_PHOTO_RETENTION_DAYS: ${KVNP_PHOTO_RETENTION_DAYS:-30}
      KVNP_PRICE_SINGLE_MINOR: ${KVNP_PRICE_SINGLE_MINOR:-999}
      KVNP_PRICE_SILVER_MONTHLY_MINOR: ${KVNP_PRICE_SILVER_MONTHLY_MINOR:-10000}
      KVNP_PRICE_SILVER_YEARLY_MINOR: ${KVNP_PRICE_SILVER_YEARLY_MINOR:-99900}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PassportLens}
      KVNP_CONTACT_EMAIL: ${KVNP_CONTACT_EMAIL:-}
    volumes:
      - kvnp_data:/app/data
      - kvnp_models:/app/models
    expose:
      - "4173"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  kvnp_data:
  kvnp_models:
  caddy_data:
  caddy_config:
