services:
  model-init:
    image: python:3.11-slim
    restart: "no"
    working_dir: /work
    environment:
      KVNP_MODEL_DIR: /app/models
    command: ["python", "tools/download_models.py", "--model", "${KVNP_QUALITY_MODEL:-birefnet-portrait}"]
    volumes:
      - ./tools/download_models.py:/work/tools/download_models.py:ro
      - kvnp_models:/app/models

  app:
    build: .
    image: kvnp-app
    restart: unless-stopped
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      KVNP_DATA_DIR: /app/data
      KVNP_MODEL_DIR: /app/models
      KVNP_MATTING_ENGINE: ${KVNP_MATTING_ENGINE:-birefnet}
      KVNP_ONNX_PROVIDER: ${KVNP_ONNX_PROVIDER:-auto}
      KVNP_ONNX_THREADS: ${KVNP_ONNX_THREADS:-2}
      KVNP_SESSION_SECRET: ${KVNP_SESSION_SECRET:?set KVNP_SESSION_SECRET in .env}
    volumes:
      - kvnp_data:/app/data
      - kvnp_models:/app/models
    expose:
      - "4173"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  kvnp_data:
  kvnp_models:
  caddy_data:
  caddy_config:
