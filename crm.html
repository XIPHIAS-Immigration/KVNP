<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clients | PassportLens</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/theme.css?v=pl-4" />
  <link rel="stylesheet" href="/src/portal.css?v=pl-4" />
  <style>
    .bars{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; align-items:end; height:140px; padding-top:10px;}
    .bar{display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
    .bar i{display:block; width:100%; max-width:46px; background:var(--navy); border-radius:6px 6px 0 0; min-height:3px;}
    .bar b{font-size:12px; color:var(--navy);} .bar span{font-size:11.5px; color:var(--mut);}
    .search-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
    .search-row input{max-width:320px;}
    .money{font-variant-numeric:tabular-nums;}
    .paid{color:var(--ok); font-weight:700;} .unpaid{color:var(--warn); font-weight:700;}
    .detail-photos .row{display:grid; grid-template-columns:1fr auto auto auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
    .detail-photos .row:last-child{border-bottom:0;}
    .detail-photos input{width:96px; padding:6px 8px;}
    .detail-photos select{padding:6px 8px;}
    .toplist{display:grid; gap:6px; font-size:14px;}
    .toplist div{display:flex; justify-content:space-between; gap:10px;}
    .toplist span{color:var(--mut);}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="PassportLens home"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="12" fill="#351C15"/><circle cx="24" cy="23" r="12.5" fill="none" stroke="#FFB500" stroke-width="3.5"/><circle cx="24" cy="23" r="5" fill="#FFB500"/><circle cx="29.5" cy="17.5" r="2" fill="#fff" opacity=".9"/><rect x="13" y="38" width="22" height="2.6" rx="1.3" fill="#FFB500" opacity=".85"/></svg><span class="brand-name">Passport<b>Lens</b></span></a>
      <nav class="topnav" aria-label="Clients"><a href="/app">Studio</a><a href="/crm" class="active">Clients</a><a href="/account">Account</a></nav>
      <div class="topbar-right"><span class="badge gold" id="org-badge"></span><a class="btn sm ghost" href="/api/crm/export.csv">Export CSV</a></div>
    </div>
  </header>

  <main class="page">
    <div class="page-title"><div><h1>Clients &amp; photos</h1><p id="org-line" class="muted"></p></div><a class="btn" href="/app">+ New photo</a></div>
    <div class="notice bad" id="err" hidden></div>

    <div class="tabs">
      <button type="button" class="on" data-tab="overview">Overview</button>
      <button type="button" data-tab="clients">Clients</button>
      <button type="button" data-tab="photos">All photos</button>
    </div>

    <section class="tab-panel" data-panel="overview">
      <div class="stat-grid" id="stats"></div>
      <div class="grid-2">
        <div class="card pad"><h3>Photos per month</h3><div class="bars" id="bars"></div></div>
        <div class="card pad"><h3>Most used programmes</h3><div class="toplist" id="top"></div></div>
      </div>
      <div class="card pad" style="margin-top:18px"><h3>Recent photos</h3><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Client</th><th>Programme</th><th>Result</th><th class="num">Amount</th><th></th></tr></thead><tbody id="recent"></tbody></table></div></div>
    </section>

    <section class="tab-panel" data-panel="clients" hidden>
      <div class="search-row">
        <input class="input" id="q" type="search" placeholder="Search name, phone or email" />
        <button class="btn sm navy" id="add-client" type="button">+ Add client</button>
      </div>
      <form class="card pad stack" id="client-form" hidden>
        <h3 id="client-form-title">New client</h3>
        <div class="two"><label class="field"><span>Name</span><input id="cf-name" required /></label><label class="field"><span>Phone</span><input id="cf-phone" type="tel" /></label></div>
        <div class="two"><label class="field"><span>Email</span><input id="cf-email" type="email" /></label><label class="field"><span>Notes</span><input id="cf-notes" /></label></div>
        <div class="btn-row"><button class="btn sm" type="submit">Save client</button><button class="btn sm ghost" type="button" id="cf-cancel">Cancel</button><span class="form-msg" id="cf-msg"></span></div>
      </form>
      <div class="table-wrap"><table class="data"><thead><tr><th>Client</th><th>Contact</th><th class="num">Photos</th><th>Last photo</th><th class="num">Billed</th><th class="num">Unpaid</th></tr></thead><tbody id="clients"></tbody></table></div>
    </section>

    <section class="tab-panel" data-panel="photos" hidden>
      <div class="search-row"><label class="switch"><input type="checkbox" id="only-unpaid" /> Show unpaid only</label></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Client</th><th>Programme</th><th>Result</th><th class="num">Amount</th><th>Paid</th><th></th></tr></thead><tbody id="photos"></tbody></table></div>
    </section>
  </main>

  <div class="modal" id="client-modal" hidden>
    <div class="card pad">
      <div class="card-head"><h3 id="cm-name">Client</h3><button class="btn sm ghost" type="button" id="cm-close">Close</button></div>
      <form id="cm-form" class="stack">
        <div class="two"><label class="field"><span>Name</span><input id="cm-name-input" required /></label><label class="field"><span>Phone</span><input id="cm-phone" type="tel" /></label></div>
        <div class="two"><label class="field"><span>Email</span><input id="cm-email" type="email" /></label><label class="field"><span>Notes</span><input id="cm-notes" /></label></div>
        <div class="btn-row"><button class="btn sm" type="submit">Save details</button><span class="form-msg" id="cm-msg"></span></div>
      </form>
      <h3 style="margin-top:18px">Photos</h3>
      <div class="detail-photos" id="cm-photos"></div>
    </div>
  </div>

  <script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var when = function (ts) { return ts ? new Date(ts * 1000).toLocaleDateString("en-CA", { year: "numeric", month: "short", day: "numeric" }) : "—"; };
    var money = function (minor, currency) { return minor == null ? "—" : (currency || "CAD") + " " + (minor / 100).toFixed(2); };
    var state = { csrf: null, clients: [], photos: [], client: null };
    function api(path, options) {
      options = options || {}; options.credentials = "same-origin";
      options.headers = Object.assign({ "content-type": "application/json" }, options.headers || {});
      if (state.csrf) options.headers["x-kvnp-csrf"] = state.csrf;
      return fetch(path, options).then(function (r) { return r.json().then(function (d) { if (!r.ok || d.ok === false) throw new Error(d.error || d.detail || "Request failed"); return d; }); });
    }
    function err(message) { $("#err").textContent = message; $("#err").hidden = false; }
    function verdictBadge(v) { var k = v === "ready" ? "ok" : (v === "retake" || v === "fix") ? "bad" : "warn"; var label = v === "ready" ? "OK" : v === "retake" ? "Retake" : v === "fix" ? "Fix" : v ? "Check" : "—"; return '<span class="badge ' + k + '">' + label + '</span>'; }

    document.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () {
      document.querySelectorAll("[data-tab]").forEach(function (x) { x.classList.toggle("on", x === b); });
      document.querySelectorAll("[data-panel]").forEach(function (p) { p.hidden = p.getAttribute("data-panel") !== b.getAttribute("data-tab"); });
      if (b.getAttribute("data-tab") === "clients") loadClients();
      if (b.getAttribute("data-tab") === "photos") loadPhotos();
    }); });

    async function loadOverview() {
      var d = await api("/api/crm/summary");
      var s = d.summary;
      $("#org-badge").textContent = d.org.planLabel;
      $("#org-line").textContent = d.org.name;
      $("#stats").innerHTML = [
        [s.photosThisMonth, "photos this month"], [s.photosTotal, "photos total"], [s.clients, "clients"],
        [money(s.revenueThisMonthMinor), "paid this month"], [money(s.unpaidMinor) + (s.unpaidCount ? " (" + s.unpaidCount + ")" : ""), "unpaid"],
      ].map(function (x) { return '<div class="stat"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join("");
      var max = Math.max.apply(null, s.months.map(function (m) { return m.count; }).concat([1]));
      $("#bars").innerHTML = s.months.map(function (m) { return '<div class="bar"><b>' + m.count + '</b><i style="height:' + Math.max(3, Math.round(m.count / max * 90)) + 'px"></i><span>' + esc(m.label) + '</span></div>'; }).join("");
      $("#top").innerHTML = s.topProgrammes.length ? s.topProgrammes.map(function (p) { return '<div>' + esc(p.label) + '<span>' + p.count + '</span></div>'; }).join("") : '<p class="muted small">No photos yet.</p>';
      $("#recent").innerHTML = d.recent.length ? d.recent.map(photoRow).join("") : '<tr><td colspan="6" class="empty">No photos saved yet. Make one in the <a href="/app">studio</a> and save it to a client.</td></tr>';
      bindRows();
    }
    function photoRow(p) {
      return '<tr><td>' + when(p.createdAt) + '</td><td>' + (p.clientId ? '<a href="#" data-open="' + p.clientId + '"><b>' + esc(p.clientName || "—") + '</b></a>' : '<span class="muted">' + esc(p.clientName || "no client") + '</span>') + '</td><td>' + esc(p.programmeLabel) + '</td><td>' + verdictBadge(p.verdict) + '</td><td class="num money">' + money(p.saleAmountMinor, p.saleCurrency) + '</td><td>' + (p.salePaid === true ? '<span class="paid">Paid</span>' : p.salePaid === false ? '<span class="unpaid">Unpaid</span>' : "") + '</td><td>' + (p.artifactAvailable ? '<a class="btn sm ghost" href="/api/crm/photos/' + p.id + '/file">File</a> ' : '') + '<a class="btn sm ghost" href="/receipt/' + p.id + '" target="_blank">Receipt</a></td></tr>';
    }
    function bindRows() { document.querySelectorAll("[data-open]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); openClient(a.getAttribute("data-open")); }); }); }

    async function loadClients() {
      var d = await api("/api/crm/clients?q=" + encodeURIComponent($("#q").value || ""));
      state.clients = d.clients;
      $("#clients").innerHTML = d.clients.length ? d.clients.map(function (c) { return '<tr class="click" data-open="' + c.id + '"><td><b>' + esc(c.name) + '</b></td><td>' + esc([c.phone, c.email].filter(Boolean).join(" · ")) + '</td><td class="num">' + c.photoCount + '</td><td>' + when(c.lastPhotoAt) + '</td><td class="num money">' + money(c.revenueMinor) + '</td><td class="num money">' + (c.unpaidMinor ? '<span class="unpaid">' + money(c.unpaidMinor) + '</span>' : '—') + '</td></tr>'; }).join("") : '<tr><td colspan="6" class="empty">No clients yet.</td></tr>';
      bindRows();
    }
    var qTimer; $("#q").addEventListener("input", function () { clearTimeout(qTimer); qTimer = setTimeout(loadClients, 250); });
    $("#add-client").addEventListener("click", function () { $("#client-form").hidden = false; $("#cf-name").focus(); });
    $("#cf-cancel").addEventListener("click", function () { $("#client-form").hidden = true; });
    $("#client-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      try { await api("/api/crm/clients", { method: "POST", body: JSON.stringify({ name: $("#cf-name").value, phone: $("#cf-phone").value, email: $("#cf-email").value, notes: $("#cf-notes").value }) }); $("#client-form").reset(); $("#client-form").hidden = true; loadClients(); }
      catch (err2) { $("#cf-msg").className = "form-msg bad"; $("#cf-msg").textContent = err2.message; }
    });

    async function loadPhotos() {
      var d = await api("/api/crm/photos");
      state.photos = d.photos;
      renderPhotos();
    }
    function renderPhotos() {
      var only = $("#only-unpaid").checked;
      var rows = state.photos.filter(function (p) { return !only || p.salePaid === false; });
      $("#photos").innerHTML = rows.length ? rows.map(photoRow).join("") : '<tr><td colspan="7" class="empty">Nothing here.</td></tr>';
      bindRows();
    }
    $("#only-unpaid").addEventListener("change", renderPhotos);

    async function openClient(id) {
      var d = await api("/api/crm/clients/" + id);
      state.client = d.client;
      $("#cm-name").textContent = d.client.name;
      $("#cm-name-input").value = d.client.name; $("#cm-phone").value = d.client.phone || ""; $("#cm-email").value = d.client.email || ""; $("#cm-notes").value = d.client.notes || "";
      $("#cm-photos").innerHTML = d.photos.length ? d.photos.map(function (p) {
        return '<div class="row" data-photo="' + p.id + '"><div><b>' + esc(p.programmeLabel) + '</b><br><span class="muted small">' + when(p.createdAt) + '</span> ' + verdictBadge(p.verdict) + '</div><input type="number" step="0.01" min="0" value="' + (p.saleAmountMinor == null ? "" : (p.saleAmountMinor / 100).toFixed(2)) + '" placeholder="CAD" data-amount /><select data-paid><option value="">—</option><option value="true"' + (p.salePaid === true ? " selected" : "") + '>Paid</option><option value="false"' + (p.salePaid === false ? " selected" : "") + '>Unpaid</option></select><div>' + (p.artifactAvailable ? '<a class="btn sm ghost" href="/api/crm/photos/' + p.id + '/file">File</a> ' : '') + '<a class="btn sm ghost" href="/receipt/' + p.id + '" target="_blank">Receipt</a></div></div>';
      }).join("") : '<p class="muted small">No photos for this client yet.</p>';
      document.querySelectorAll("#cm-photos [data-amount], #cm-photos [data-paid]").forEach(function (input) {
        input.addEventListener("change", async function () {
          var row = input.closest("[data-photo]");
          var amount = row.querySelector("[data-amount]").value; var paid = row.querySelector("[data-paid]").value;
          try { await api("/api/crm/photos/" + row.getAttribute("data-photo"), { method: "PATCH", body: JSON.stringify({ saleAmount: amount === "" ? null : Number(amount), salePaid: paid === "" ? null : paid === "true" }) }); }
          catch (e) { err(e.message); }
        });
      });
      $("#client-modal").hidden = false;
    }
    $("#cm-close").addEventListener("click", function () { $("#client-modal").hidden = true; loadClients(); loadOverview(); });
    $("#client-modal").addEventListener("click", function (e) { if (e.target === $("#client-modal")) $("#cm-close").click(); });
    $("#cm-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      try { await api("/api/crm/clients/" + state.client.id, { method: "PATCH", body: JSON.stringify({ name: $("#cm-name-input").value, phone: $("#cm-phone").value, email: $("#cm-email").value, notes: $("#cm-notes").value }) }); $("#cm-msg").className = "form-msg ok"; $("#cm-msg").textContent = "Saved."; $("#cm-name").textContent = $("#cm-name-input").value; }
      catch (e2) { $("#cm-msg").className = "form-msg bad"; $("#cm-msg").textContent = e2.message; }
    });

    fetch("/api/auth/me", { credentials: "same-origin" }).then(function (r) { return r.json(); }).then(function (me) {
      if (!me.user) { location.href = "/app"; return; }
      state.csrf = me.csrfToken;
      if (!me.plan || !me.plan.crm) { err("Client records are part of the Silver, Gold and Platinum business plans."); return; }
      loadOverview().catch(function (e) { err(e.message); });
    });
  })();
  </script>
</body>
</html>
